name: Bug Report
description: Report a crash, error, or unexpected behaviour in Iron & Arcana.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check the [existing issues](../../issues) to avoid duplicates.

  - type: input
    id: modpack-version
    attributes:
      label: Modpack Version
      description: Which version of Iron & Arcana are you running?
      placeholder: "e.g. 1.3.2"
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft / NeoForge Version
      description: Minecraft version and NeoForge build number.
      placeholder: "e.g. MC 1.21.1 / NeoForge 21.1.77"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug. What did you expect to happen vs. what actually happened?
      placeholder: "I expected X to happen, but instead Y occurred."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue reliably.
      placeholder: |
        1. Start a new world
        2. Craft X
        3. Use it on Y
        4. Game crashes / X happens
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Always
        - Sometimes
        - Happened once
    validations:
      required: true

  - type: textarea
    id: crash-log
    attributes:
      label: Crash Log / Error Output
      description: |
        Paste the full crash log or relevant log excerpt here.
        Find logs at .minecraft/logs/latest.log or .minecraft/crash-reports/.
        Use a paste site like https://paste.gg if it is very long.
      render: text

  - type: textarea
    id: additional-mods
    attributes:
      label: Additional / Modified Mods
      description: List any mods you have added to or removed from the pack. Leave blank if running unmodified.
      placeholder: "Added: JourneyMap 6.x\nRemoved: None"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Screenshots, world type, server vs. singleplayer, anything else relevant.
