name: Performance Issue
description: Report lag, low FPS, excessive memory usage, or other performance problems.
title: "[Performance] "
labels: ["performance", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Performance issues are often hardware- or config-specific. Please fill this out as completely as possible — vague reports are very hard to action.

  - type: input
    id: modpack-version
    attributes:
      label: Modpack Version
      placeholder: "e.g. 1.3.2"
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft / NeoForge Version
      placeholder: "e.g. MC 1.21.1 / NeoForge 21.1.77"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Performance Problem
      description: What are you experiencing? Low FPS, stuttering, memory leak, long world load times, server TPS drop, etc.
      placeholder: "FPS drops from ~60 to ~5 when entering the Nether."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: When Does It Occur?
      description: Specific conditions, dimensions, actions, or mod features that trigger the problem.
      placeholder: |
        - Happens when: entering the Nether / chunk loading / using X feature
        - Consistent or intermittent?
        - Does it recover, or persist until restart?
    validations:
      required: true

  - type: dropdown
    id: play-type
    attributes:
      label: Singleplayer or Multiplayer?
      options:
        - Singleplayer
        - Self-hosted server
        - Dedicated server
    validations:
      required: true

  - type: textarea
    id: system-specs
    attributes:
      label: System Specs
      description: CPU, RAM total, RAM allocated to Minecraft, GPU, OS.
      placeholder: |
        CPU: Ryzen 5 5600X
        RAM (total): 32 GB
        RAM (allocated to MC): 8 GB
        GPU: RX 6700 XT
        OS: Windows 11
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: Run `java -version` in a terminal.
      placeholder: "e.g. OpenJDK 21.0.3"

  - type: textarea
    id: jvm-args
    attributes:
      label: JVM / Launcher Arguments
      description: Paste your current JVM flags if you have custom ones set.
      render: text

  - type: textarea
    id: profiler-output
    attributes:
      label: Profiler Output (optional but very helpful)
      description: |
        If you can, run the in-game Spark profiler (/spark profiler) and paste the share URL here.
        Alternatively attach a log snippet showing memory/TPS readings.

  - type: textarea
    id: additional-mods
    attributes:
      label: Additional / Modified Mods
      description: Any mods added or removed from the base pack.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Anything else that might be relevant.
