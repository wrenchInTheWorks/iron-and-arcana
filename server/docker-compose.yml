name: iron-and-arcana

services:
  minecraft:
    image: itzg/minecraft-server:java17 # 1.20.1 runs on Java 17, not 21
    container_name: iron-and-arcana
    restart: unless-stopped
    stdin_open: true
    tty: true

    # LOAD-BEARING -- this is what stops a stop from eating placed blocks.
    # Docker SIGKILLs a container 10 seconds after asking it to stop unless told
    # otherwise, and Minecraft's shutdown saves PLAYERS first and CHUNKS second.
    # A kill inside that window keeps every inventory as it is now and rolls the
    # world back to the last autosave: placed blocks vanish and do not come back
    # to anyone's inventory. Every `docker compose stop`, `restart` and `down`,
    # and every update (`up -d` recreating the container), goes through this.
    # It must be longer than STOP_DURATION below, or Docker kills Java while the
    # image is still waiting for it. Exit code 137 after a stop = too short.
    stop_grace_period: 3m

    ports:
      - "${GAME_PORT:-25565}:25565"
      # BLUEMAP_BIND=127.0.0.1 keeps the map off the LAN. The live host does
      # that: its Cloudflare tunnel reaches BlueMap over this stack's network,
      # so the published port is only for checks run on the host itself.
      - "${BLUEMAP_BIND:-0.0.0.0}:${BLUEMAP_PORT:-8100}:8100"
      # RCON (25575) is deliberately not published — reach it with
      # `docker compose exec minecraft rcon-cli`

    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      FORGE_VERSION: "47.4.10"

      # packwiz-installer runs on every container start, so the server syncs
      # to whatever pack.toml says: `docker compose restart` IS the update.
      PACKWIZ_URL: "${PACKWIZ_URL}"

      # Self-hosting means nothing injects -Xmx behind our back, unlike the
      # Modrinth panel — see SERVER_PERFORMANCE_NOTES.md. USE_AIKAR_FLAGS is
      # the same G1GC tuning that investigation landed on.
      INIT_MEMORY: "${INIT_MEMORY:-2G}"
      MAX_MEMORY: "${MAX_MEMORY:-6G}"
      USE_AIKAR_FLAGS: "TRUE"

      # Biggest single TPS win found in v1: fewer ticking chunks.
      VIEW_DISTANCE: "${VIEW_DISTANCE:-8}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-4}"

      MAX_PLAYERS: "${MAX_PLAYERS:-8}"
      DIFFICULTY: "${DIFFICULTY:-normal}"

      # World seed. Applied ONLY when the world is first generated - setting it
      # later does nothing to an existing world. Declared here rather than left
      # in server.properties because that file lives inside the volume, so a
      # fresh volume (a rebuild, or the move to another host) would lose it.
      SEED: "${SEED:-}"
      MOTD: "${MOTD:-Iron & Arcana 2.0}"
      ALLOW_FLIGHT: "TRUE" # Botania/Create flight otherwise trips the kick check
      # Both MERGE into the live json files rather than replacing them, so
      # names the Discord bot adds over RCON survive restarts. Never add
      # OVERRIDE_WHITELIST/OVERRIDE_OPS here -- see .env.example for why.
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-TRUE}"
      WHITELIST: "${WHITELIST}"
      OPS: "${OPS}"

      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD}"

      TZ: "${TZ:-Pacific/Auckland}"
      ENABLE_ROLLING_LOGS: "TRUE"

      # How long the image's wrapper waits for Java to exit after sending
      # `stop` (default 60s). Saving five-plus dimensions and MineColonies'
      # colony data can outrun a minute. Keep it below stop_grace_period above.
      STOP_DURATION: "150"

    volumes:
      - data:/data
      # Escape hatch for jars packwiz-installer cannot fetch (a mod whose
      # CurseForge distribution is disabled). Drop the jar in and restart.
      - ./mods-override:/mods:ro

    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  data:
